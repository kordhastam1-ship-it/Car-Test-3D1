<!DOCTYPE html><html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Car 3D Test</title><style>
body {
    margin: 0;
    overflow: hidden;
    background: #777;
}
#status {
    position: fixed;
    top: 15px;
    right: 15px;
    background: #111;
    color: white;
    padding: 14px;
    border-radius: 10px;
    font: 15px Arial;
    z-index: 10;
    direction: rtl;
}
</style><script type="importmap">
{
  "imports": {
    "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js",
    "three/addons/": "https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/"
  }
}
</script></head><body><div id="status">در حال بارگذاری ماشین...</div><script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { OrbitControls } from 'three/addons/controls/OrbitControls.js';

const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x777777);

const camera = new THREE.PerspectiveCamera(
  50, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(5, 3, 7);

const renderer = new THREE.WebGLRenderer({antialias:true});
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 7);
scene.add(light);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;
controls.target.set(0, 0, 0);

const loader = new GLTFLoader();

loader.load(
  './car.glb',

  function(gltf) {
    const car = gltf.scene;

    const box = new THREE.Box3().setFromObject(car);
    const size = box.getSize(new THREE.Vector3());
    const center = box.getCenter(new THREE.Vector3());

    car.position.sub(center);

    const maxSize = Math.max(size.x, size.y, size.z);
    if (maxSize > 0) {
      car.scale.setScalar(4 / maxSize);
    }

    scene.add(car);

    status.textContent = 'ماشین با موفقیت بارگذاری شد!';

    console.log('CAR LOADED', gltf);
  },

  function(xhr) {
    if (xhr.total > 0) {
      status.textContent =
        'درصد بارگذاری: ' +
        Math.round(xhr.loaded / xhr.total * 100) + '%';
    }
  },

  function(error) {
    console.error(error);
    status.textContent = 'خطا: ' + (error.message || 'بارگذاری ناموفق');
  }
);

function animate() {
  requestAnimationFrame(animate);
  controls.update();
  renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
  camera.aspect = window.innerWidth / window.innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(window.innerWidth, window.innerHeight);
});
</script></body>
</html>
