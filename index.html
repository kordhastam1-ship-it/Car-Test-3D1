<!DOCTYPE html><html lang="fa">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Car 3D Test</title>
<style>
body {
    margin: 0;
    overflow: hidden;
    background: #222;
}
#status {
    position: fixed;
    top: 15px;
    right: 15px;
    color: white;
    background: #111;
    padding: 12px;
    border-radius: 8px;
    font-family: sans-serif;
    z-index: 10;
}
</style>
</head>
<body><div id="status">در حال بارگذاری ماشین...</div><script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
import { GLTFLoader } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/loaders/GLTFLoader.js';
import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.160.0/examples/jsm/controls/OrbitControls.js';

const status = document.getElementById('status');

const scene = new THREE.Scene();
scene.background = new THREE.Color(0x777777);

const camera = new THREE.PerspectiveCamera(
    60, window.innerWidth / window.innerHeight, 0.1, 1000
);
camera.position.set(5, 3, 7);

const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setSize(window.innerWidth, window.innerHeight);
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
renderer.outputColorSpace = THREE.SRGBColorSpace;
document.body.appendChild(renderer.domElement);

scene.add(new THREE.HemisphereLight(0xffffff, 0x444444, 2));

const light = new THREE.DirectionalLight(0xffffff, 3);
light.position.set(5, 10, 7);
scene.add(light);

const loader = new GLTFLoader();

loader.load(
    './car.glb',
    (gltf) => {
        const car = gltf.scene;

        const box = new THREE.Box3().setFromObject(car);
        const size = box.getSize(new THREE.Vector3());
        const center = box.getCenter(new THREE.Vector3());

        car.position.sub(center);

        const maxSize = Math.max(size.x, size.y, size.z);
        if (maxSize > 0) {
            car.scale.setScalar(4 / maxSize);
        }

        scene.add(car);

        status.textContent = 'ماشین با موفقیت نمایش داده شد!';
    },
    (xhr) => {
        if (xhr.total) {
            status.textContent =
                'بارگذاری: ' + Math.round(xhr.loaded / xhr.total * 100) + '%';
        }
    },
    (error) => {
        console.error(error);
        status.textContent = 'خطا در بارگذاری مدل ماشین!';
    }
);

const controls = new OrbitControls(camera, renderer.domElement);
controls.enableDamping = true;

function animate() {
    requestAnimationFrame(animate);
    controls.update();
    renderer.render(scene, camera);
}
animate();

window.addEventListener('resize', () => {
    camera.aspect = window.innerWidth / window.innerHeight;
    camera.updateProjectionMatrix();
    renderer.setSize(window.innerWidth, window.innerHeight);
});
</script></body>
  </html>
